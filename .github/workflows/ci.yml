name: Проверки
# «Шеф»: те же проверки, что исполнитель запускает у себя (make check),
# и сторож защищённых путей для веток исполнителя.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Сторож берётся из базовой ветки: правка сторожа в ветке исполнителя не действует.
      - name: Защищённые пути
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show "FETCH_HEAD:.github/alliance/guard.py" > "$RUNNER_TEMP/guard.py" 2>/dev/null \
            || cp .github/alliance/guard.py "$RUNNER_TEMP/guard.py"
          git diff --name-status FETCH_HEAD HEAD > "$RUNNER_TEMP/changes.txt"
          python3 "$RUNNER_TEMP/guard.py" "$HEAD_REF" "$RUNNER_TEMP/changes.txt"

      - run: make check
